source: 'Derived by binding the live MCP tools/list (mcp/claix-dev-mcp-tools-list.json, 17 tools, HTTP 200 anonymous)
  and the 20 A2A skills in a2a/claix-dev-agent-card.json to the 20 operations in openapi/claix-dev-openapi.yml (Claix
  API 1.8.2). The A2A bindings are the provider''s own: the card''s openapi-skills extension carries openApiOperationId/openApiPath/openApiMethod
  per skill and every one was checked against the spec (method + path + operationId all match). MCP bindings come
  from the tool descriptions and the docs table.'
purpose: Make the MCP tool and the A2A skill first-class discovery units bound to the REST operation that backs
  them, so an agent can read the operation's parameters/requestBody as the tool's real input contract. Claix is
  unusual in that all three surfaces (REST, MCP, A2A) are projections of ONE 20-operation contract and the provider
  publishes the crosswalk itself.
