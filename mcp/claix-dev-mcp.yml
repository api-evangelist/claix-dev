description: Claix ships a hosted, remote MCP server on its own domain. The documented URL is https://claix.dev/mcp;
  the apex answers 308 to https://www.claix.dev/mcp, which is the URL an MCP client actually ends up POSTing
  to. tools/list, prompts/list, resources/list and initialize all answer anonymously (tool CALLS require
  the x-api-key header or an api_key argument). The full tools/list body, with every inputSchema, outputSchema
  and annotation, is saved verbatim in claix-dev-mcp-tools-list.json.
