method: probed
status: published
source: https://www.claix.dev/documentation/mcp
tools_source: https://www.claix.dev/mcp (anonymous JSON-RPC tools/list, HTTP 200, 2026-09-19)
llms_source: https://www.claix.dev/llms.txt
description: >-
  Claix ships a hosted, remote MCP server on its own domain. The documented URL is
  https://claix.dev/mcp; the apex answers 308 to https://www.claix.dev/mcp, which is the URL an
  MCP client actually ends up POSTing to. tools/list, prompts/list, resources/list and initialize
  all answer anonymously (tool CALLS require the x-api-key header or an api_key argument). The
  full tools/list body, with every inputSchema, outputSchema and annotation, is saved verbatim in
  claix-dev-mcp-tools-list.json.
deployment:
  mode: remote
  endpoint: https://www.claix.dev/mcp
  documented_endpoint: https://claix.dev/mcp
  install: null
  package: null
  auth: api-key
  verified: probed
  transports:
    - streamable-http    # POST /mcp, Accept: application/json, text/event-stream
    - sse                # GET /mcp + POST /mcp/message?sessionId=... (legacy, via mcp-remote)
  listings:
    - registry: smithery
      qualified_name: info-f4xz/claix
      url: https://smithery.ai/server/info-f4xz/claix
      deployment_url: https://claix--info-f4xz.run.tools
      install: npx -y @smithery/cli run info-f4xz/claix
      note: >-
        Smithery-hosted proxy of the same server; the registry record
        (registry.smithery.ai/servers/info-f4xz/claix, 200) maps its APIKEY config field to the
        x-api-key header.
server:
  name: claix
  version_observed:
    initialize_serverInfo: 1.7.0          # live initialize response, 2026-09-19
    docs_page: 1.9.0                      # https://www.claix.dev/documentation/mcp
    well_known_server_card: 1.5.0         # well-known/claix-dev-mcp-server-card.json
  protocol_version: '2025-06-18'
  capabilities: {tools: {listChanged: true}, prompts: {listChanged: true}, resources: {listChanged: true}, completions: {}}
  static_metadata: https://claix.dev/.well-known/mcp/server-card.json
auth:
  methods: [apikey]
  apikey:
    header: x-api-key
    fallback: api_key argument on every tool (for clients that cannot send custom headers)
    note: The same key authenticates REST, A2A and MCP. No OAuth; /.well-known/oauth-* all 404.
tool_count: 17
