          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite GET)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /document-context/{document_id}:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    post:
      operationId: documentContextAsk
      tags:
        - Ventana de Contexto
      summary: Responde preguntas sobre un documento persistido
      description: >
        Equivale a POST https://claix.dev/document-context/{document_id}.
        Recibe un document_id en la URL (el que devolvió una extracción con
        window_context activo) y un array `questions` de objetos
        `{ question, format }` en JSON. Carga markdown_content de la tabla
        documents, llama a Gemini 3.6 con el mismo modelo y generationConfig
        que el resto de funciones, y devuelve `{ user_ask, ia_response, log_id }`
        con respuestas tipadas según el `format` de cada pregunta
        (`string` | `int` | `boolean` | `timestamp` | `array`, o `null`). Si la
        verificación de fuente está activada en consulta a documentos, cada ítem
        de `ia_response` es `{ value, source }` con la evidencia citada del
        markdown (texto plano). Máximo 5 preguntas y 400 caracteres por
        pregunta. El documento debe pertenecer a la cuenta de la API key y no
        haber expirado.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del documento persistido en documents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowContextRequest'
      responses:
        '200':
          description: Preguntas respondidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowContextSuccessResponse'
        '400':
          description: Petición inválida (JSON, questions o document_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El documento no existe, no pertenece a la cuenta o ha expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /space-context/{space_id}:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    post:
      operationId: spaceContextAsk
      tags:
        - Espacios de Conocimiento
      summary: Responde preguntas cruzando todos los documentos de un espacio
      description: >
        Equivale a POST https://claix.dev/space-context/{space_id}.
        Mismo formato de entrada y de salida que
        POST /document-context/{document_id}: body con un array `questions` de
        objetos `{ question, format }` (máximo 5 preguntas, 400 caracteres cada
        una; `format` ∈ `string` | `int` | `boolean` | `timestamp` | `array`)
        y respuesta `{ user_ask, ia_response, log_id }` tipada y alineada 1:1.
        Si la verificación de fuente está activada en consulta a espacio de
        conocimiento, cada ítem de `ia_response` es `{ value, source }` nombrando
        `document_id` y `file_name`. La única diferencia de alcance es que, en
        vez de un único documento, carga el markdown_content de todos los
        documentos vigentes cuyo `espacio_id` sea ese space_id, y responde
        cruzando la información entre ellos (comparar, sumar, relacionar o
        consolidar datos repartidos en varios archivos). El espacio debe
        pertenecer a la cuenta de la API key. Los documentos expirados se
        ignoran. Para acotar coste y mantener la precisión del modelo se cargan
        como máximo 50 documentos y 200.000 caracteres en total, repartidos
        entre ellos.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context
      parameters:
        - name: space_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
