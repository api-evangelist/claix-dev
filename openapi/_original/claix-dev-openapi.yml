  /replace-document:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    post:
      operationId: replaceDocument
      tags:
        - Ventana de Contexto
      summary: Sustituye el contenido de un documento con el de otro
      description: >
        Equivale a POST https://claix.dev/replace-document. Reemplaza el
        contenido de `document_id` con el de `new_content_document_id`
        mediante un RPC. El documento fuente se elimina. Se incrementa la
        `version` del documento destino. Conserva el mismo `document_id`
        (y su espacio, si lo tiene) mientras se actualiza el contenido con
        una nueva extracción. Ambos documentos deben pertenecer a la cuenta
        de la API key. Esta llamada es gratuita: no se factura ni consume el
        cupo de extracciones.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context/replace-document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDocumentRequest'
            example:
              document_id: d4a1e9d2-8b1c-4f3e-9a02-8b1e9f3c7a4b
              new_content_document_id: a8c3f1e0-2d4b-4a9e-8c71-5f0e2b9d6a3c
      responses:
        '200':
          description: Contenido sustituido; el documento fuente ha sido eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceDocumentSuccessResponse'
        '400':
          description: >
            Payload inválido (UUIDs ausentes o mal formados) o la operación no
            es válida (por ejemplo, ids iguales)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Alguno de los dos documentos no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

