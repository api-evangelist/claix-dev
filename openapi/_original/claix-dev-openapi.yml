openapi: 3.0.3
info:
  title: Claix API
  description: >
    Claix es una API de conversión de datos tabulares, JSON y documentos
    (PDF, Word, texto plano, imágenes, audio) pensada para integraciones server-to-server
    (backends, scripts, herramientas de automatización como n8n, Zapier o
    Make). Source Tracing opcional: citas por campo `{ value, source }` o
    `requires_human_revision` si falta evidencia. Expone seis endpoints
    principales de conversión:

    - **Excel/CSV → JSON**: recibe un archivo Excel o CSV y lo transforma en
      JSON según la estructura definida en un "schema" previamente creado.
    - **JSON → Excel**: recibe uno o varios documentos JSON y devuelve un
      archivo Excel (.xlsx) binario, según la estructura definida en un
      "schema" previamente creado.
    - **PDF → JSON**: recibe un archivo PDF (de texto o escaneado) y devuelve
      un objeto JSON con los datos extraídos del documento, según la
      estructura definida en un "schema" previamente creado.
    - **Documento → JSON**: recibe un archivo de documento (.docx, .txt, .md
      o .rtf) y devuelve un objeto JSON con los datos extraídos, según la
      estructura definida en un "schema" previamente creado.
    - **Imagen → JSON**: recibe una imagen (.jpeg, .jpg, .png, .webp, .heic
      o .heif) y devuelve un objeto JSON con los datos extraídos del
      contenido visible, según la estructura definida en un "schema"
      previamente creado.
    - **Txt / HTML / XML → JSON**: recibe el campo `content` (texto plano,
      HTML o XML ya procesado, sin archivo) y devuelve un objeto JSON con los
      datos extraídos, según un schema de tipo txt-json. Máximo 300.000
      caracteres. Tarifa fija €0,10 por llamada exitosa tras el free tier.
    - **Excel/CSV → Markdown**, **PDF → Markdown**, **Documento → Markdown**,
      **Imagen → Markdown**, **Txt/HTML/XML → Markdown** y **Audio → Markdown**:
      misma autenticación, mismos formatos y mismos límites que el endpoint JSON
      equivalente. No piden schema_id. save=true inserta el Markdown en la base
      conectada y la respuesta incluye row_id. PDF con texto, Excel, documentos y
      texto se convierten en local. PDF escaneado, imagen y audio llaman al
      mismo modelo con BYOK.
    - **Audio → JSON**: recibe un archivo de audio (.mp3, .wav, .m4a o .ogg)
      y un schema_id, y devuelve un único objeto JSON con los datos extraídos
      de lo hablado. Tamaño máximo 12 MB y duración máxima 10 minutos. Si el
      audio no es inteligible, responde 422.

    Además, expone endpoints para consultar y gestionar los schemas
    de la cuenta:

    - **Listar schemas**: dado un API key, devuelve todos los schemas de esa
      cuenta con su información completa (id, nombre, tipo y definición).
    - **Obtener schema**: dado un `schema_id` en la URL, devuelve ese schema
      con su definición completa.
    - **Crear schema**: crea un schema con `name`, `type`, `schema_definition`
      y, opcionalmente, Modo Agente (`is_agent_mode`, `agent_definition`,
      `resumen_agent`) y verificación de fuente.
    - **Actualizar schema**: sustituye la configuración completa de un schema
      existente (`schema_id` en la URL; mismo body que crear).
    - **Borrar schema**: elimina un schema de la cuenta por `schema_id`.

    **Ventana de Contexto** — Tras una extracción con `window_context`
    activo, el `document_id` devuelto permite consultar el contenido bruto,
    preguntar al markdown persistido o eliminar el documento:

    - **GET https://claix.dev/get-document/{document_id}**: devuelve el
      contenido bruto y metadatos del documento (`content`, `file_name`,
      `schema_id`, `processed_at`). Llamada gratuita.
    - **POST https://claix.dev/document-context/{document_id}**: body
      `{ "questions": [{ "question": "...", "format": "string"|"int"|"boolean"|"timestamp"|"array" }] }`
      (máximo 5 preguntas, 400 caracteres cada una). Respuesta
      `{ user_ask, ia_response, log_id }`. Cada respuesta respeta el `format`
      pedido (o `null`). Si la verificación de fuente está activada en consulta
      a documentos, cada ítem de `ia_response` es `{ value, source }`.
    - **DELETE https://claix.dev/delete-document/{document_id}**: elimina el
      documento persistido por `document_id`. Sin body ni query params.
      Respuesta `{ document_id }`. Llamada gratuita.
    - **POST https://claix.dev/replace-document**: body
      `{ "document_id": "...", "new_content_document_id": "..." }`. Sustituye
      el contenido del documento destino con el del documento fuente; el
      fuente se elimina. Conserva el `document_id` estable (y su espacio).
      Respuesta `{ success, swap_id, document_id, source_document_id,
      file_name, version, swaps_count, message }`. Llamada gratuita.

    **Espacios de Conocimiento** — Los documentos persistidos se pueden agrupar
    en espacios (`space_id` opcional en los endpoints de extracción). Una vez
    agrupados, se puede preguntar al espacio completo en lugar de a un único
    documento:

    - **POST https://claix.dev/create-space**: body `{ "name": "..." }`.
      Crea un espacio y devuelve `{ success, space: { space_id, name,
      created_at } }`. Máximo 10 documentos por space_id. Llamada gratuita.
    - **DELETE https://claix.dev/delete-space/{space_id}**: elimina el espacio.
      Sin body ni query params. Respuesta `{ space_id }`. Llamada gratuita.
    - **POST https://claix.dev/add-space**: body
      `{ "document_id": "...", "space_id": "..." }`. Asigna un documento
      que aún no tiene espacio a un espacio existente. Si ya pertenece a uno
      o el espacio ya tiene 10 documentos, responde 400. Respuesta
      `{ success, document_id, space_id, space_name, file_name, version,
      message }`. Llamada gratuita.
    - **DELETE https://claix.dev/remove-document-from-space/{document_id}**:
      desacopla el documento de su espacio (`espacio_id` → null). Sin body.
      También acepta POST. Respuesta `{ success, document_id,
      previous_space_id, espacio_id, file_name, version, message }`.
      Llamada gratuita.
    - **POST https://claix.dev/space-context/{space_id}**: body
      `{ "questions": [{ "question": "...", "format": "string"|"int"|"boolean"|"timestamp"|"array" }] }`
      (máximo 5 preguntas, 400 caracteres cada una), exactamente igual que
      document-context. La diferencia es el alcance: la respuesta se construye
      cruzando el `markdown_content` de todos los documentos vigentes del
      espacio, no de uno solo. Respuesta `{ user_ask, ia_response, log_id }`.
      Si la verificación de fuente está activada en consulta a espacio de
      conocimiento, cada ítem de `ia_response` es `{ value, source }` nombrando
      `document_id` y `file_name`.
    - **POST https://claix.dev/multi-document**: hasta 10 archivos de los
      formatos de Extracción → Markdown, más `questions` con el mismo formato
      que space-context. Cada archivo se convierte a Markdown y las preguntas
      se responden cruzando esos textos. Respuesta `{ user_ask, ia_response,
      documents_processed, log_id }`. `window_context`, `window_time` y
      `space_id` siguen siendo opcionales en este endpoint. La conversión a
      Markdown usa `save`, no esos campos.

    Los seis endpoints de conversión usan reconocimiento automático de sinónimos,
    abreviaturas, traducciones y variantes de nombre entre las
    columnas/claves/campos de entrada y las propiedades definidas en el
    schema correspondiente.

    **Modo Agente** — Cinco endpoints adicionales bajo `/agent/*-json` ejecutan
    la misma extracción estructurada que sus equivalentes `/api/*-json` y, a
    continuación, una fase de razonamiento semántico según `agent_definition`
    del schema. La respuesta HTTP 200 incluye los campos habituales de
    extracción más `agent_data` (objeto tipado con booleanos, enteros, strings
    u opciones cerradas). El schema debe tener `is_agent_mode` activado.

    **log_id** — Las extracciones, el modo agente, document-context y
    space-context incluyen `log_id` (UUID de `usage_logs`) en la respuesta de
    éxito y en la mayoría de errores una vez autenticada la petición.

    **Verificación de fuente** — Si está activada en el schema, cada
    propiedad extraída (y cada campo de `agent_data`) es un objeto
    `{ value, source }` en lugar de un valor plano. `source` cita la evidencia
    (página, párrafo, celda, fragmento o zona de la imagen). Si no hay
    evidencia, `source` es exactamente `requires_human_revision`. Si está
    desactivada, el formato no cambia. En document-context y space-context
    el interruptor es por cuenta (consulta a documentos / consulta a espacio
    de conocimiento), no por schema.
  version: "1.12.0"
servers:
  - url: https://claix.dev/api
    description: Producción (dominio público Claix)

security:
  - ApiKeyAuth: []
  - BearerAuth: []

tags:
  - name: Markdown
    description: >
      Conversión de archivos a Markdown, sin schema. Mismos formatos que los
      endpoints de extracción a JSON. space_id es opcional. PDF digital, Excel,
      documentos de texto y txt/HTML/XML se convierten en local. PDF escaneado,
      imagen y audio usan el mismo modelo y el mismo BYOK que su endpoint JSON.
  - name: Excel a JSON
    description: Conversión de archivos Excel/CSV a JSON estructurado
  - name: JSON a Excel
    description: Conversión de datos JSON a archivos Excel binarios
  - name: PDF a JSON
    description: Extracción de datos estructurados a partir de archivos PDF
  - name: Documento a JSON
    description: >
      Extracción de datos estructurados a partir de documentos de texto
      (.docx, .txt, .md, .rtf)
  - name: Imagen a JSON
    description: >
      Extracción de datos estructurados a partir de imágenes
      (.jpeg, .jpg, .png, .webp, .heic, .heif)
  - name: Texto a JSON
    description: >
      Extracción de datos estructurados a partir de texto plano, HTML o XML
      ya procesado (campo content, sin archivo)
  - name: Audio a JSON
    description: >
      Extracción de datos estructurados a partir de audio hablado
      (.mp3, .wav, .m4a, .ogg)
  - name: Ventana de Contexto
    description: >
      Consulta de contenido bruto, preguntas, borrado o sustitución de contenido
      de un documento persistido (markdown_content) identificado por document_id.
      URLs públicas: GET https://claix.dev/get-document/{document_id}; POST
      https://claix.dev/document-context/{document_id}; DELETE
      https://claix.dev/delete-document/{document_id}; POST
      https://claix.dev/replace-document.
  - name: Espacios de Conocimiento
    description: >
      Creación y borrado de espacios de conocimiento, asignación o desacoplado
      de documentos a un espacio, y preguntas cruzadas sobre todos los documentos
      vigentes agrupados en uno de ellos. El formato de entrada y salida de las
      preguntas es el mismo que en la ventana de contexto. URLs públicas: POST
      https://claix.dev/create-space; DELETE
      https://claix.dev/delete-space/{space_id}; POST https://claix.dev/add-space;
      DELETE https://claix.dev/remove-document-from-space/{document_id}; POST
      https://claix.dev/space-context/{space_id}.
  - name: Schemas
    description: Consulta de los schemas creados en la cuenta
  - name: Modo Agente
    description: >
      Extracción estructurada más razonamiento semántico en una sola llamada.
      Requiere schema con is_agent_mode activado y agent_definition configurada.
      URLs públicas: POST /agent/excel-json, /agent/pdf-json, /agent/doc-json,
      /agent/img-json, /agent/txt-json, /agent/audio-json (documentación humana en /documentation/agent/*).

paths:
  /excel-markdown:
    post:
      operationId: excelToMarkdown
      tags: [Markdown]
      summary: Convierte la primera hoja de un Excel o CSV a Markdown
      description: >
        Igual que /excel-json en autenticación, formatos y parseo de la primera
        hoja, sin schema_id y sin llamada a un modelo. Devuelve el Markdown.
        El Markdown se devuelve siempre. Con save=true se inserta en la base
        conectada, según las reglas activas de Markdown, y la respuesta incluye
        row_id. save=false, o omitir save, no inserta.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkdownFileRequest'
      responses:
        '200':
          description: Markdown generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownSuccessResponse'
        '400':
          description: Archivo ausente, vacío o ilegible, o save distinto de true o false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key inválida o cuenta no activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La fila choca con una clave única de la base conectada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Archivo demasiado grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: No se pudo producir Markdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pdf-markdown:
    post:
      operationId: pdfToMarkdown
      tags: [Markdown]
      summary: Convierte un PDF a Markdown
      description: >
        PDF con texto seleccionable se convierte en local. Un PDF escaneado usa
        el mismo modelo y el mismo BYOK que /pdf-json, pidiendo solo Markdown.
        Máximo 15 MB. Sin schema_id.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkdownFileRequest'
      responses:
        '200':
          description: Markdown generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownSuccessResponse'
        '400':
          description: Archivo ausente o que no es un PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key inválida o cuenta no activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: PDF por encima de 15 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: PDF escaneado ilegible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo de la llamada al modelo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /doc-markdown:
    post:
      operationId: docToMarkdown
      tags: [Markdown]
      summary: Convierte un documento de texto a Markdown
      description: >
        Acepta .docx, .txt, .md y .rtf, máximo 10 MB, igual que /doc-json.
        El .doc antiguo se rechaza. Conversión local, sin schema_id y sin modelo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkdownFileRequest'
      responses:
        '200':
          description: Markdown generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownSuccessResponse'
        '400':
          description: Formato no soportado, archivo vacío o .doc legacy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key inválida o cuenta no activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Documento por encima de 10 MB o 300000 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /img-markdown:
    post:
      operationId: imgToMarkdown
      tags: [Markdown]
      summary: Transcribe una imagen a Markdown
      description: >
        Mismos formatos (.jpeg, .jpg, .png, .webp, .heic, .heif), firma binaria,
        máximo 15 MB y control de calidad que /img-json. La llamada al modelo y
        BYOK es la misma. Sin schema_id. 422 si la imagen no es legible.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkdownFileRequest'
      responses:
        '200':
          description: Markdown generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownSuccessResponse'
        '400':
          description: Formato no soportado o firma binaria inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key inválida o cuenta no activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Imagen por encima de 15 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Imagen ilegible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo de la llamada al modelo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /txt-markdown:
    post:
      operationId: txtToMarkdown
      tags: [Markdown]
      summary: Convierte texto, HTML o XML a Markdown
      description: >
        Campo content, sin archivo, máximo 300000 caracteres, igual que
        /txt-json. Conversión local, sin schema_id y sin modelo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkdownContentRequest'
      responses:
        '200':
          description: Markdown generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownSuccessResponse'
        '400':
          description: content ausente o vacío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key inválida o cuenta no activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Más de 300000 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /audio-markdown:
    post:
      operationId: audioToMarkdown
      tags: [Markdown]
      summary: Transcribe un audio a Markdown
      description: >
        Mismos formatos (.mp3, .wav, .m4a, .ogg), firma binaria, máximo 12 MB y
        10 minutos que /audio-json. La llamada al modelo y BYOK es la misma.
        Sin schema_id. 422 si no hay habla inteligible.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkdownFileRequest'
      responses:
        '200':
          description: Markdown generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownSuccessResponse'
        '400':
          description: Formato no soportado o firma binaria inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key inválida o cuenta no activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Audio por encima de 12 MB o 10 minutos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Audio sin habla inteligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo de la llamada al modelo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /multi-document:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    post:
      operationId: multiDocumentAsk
      tags:
        - Ventana de Contexto
      summary: Responde preguntas cruzando hasta 10 documentos enviados en la misma llamada
      description: >
        Equivale a POST https://claix.dev/multi-document.
        Multipart con hasta 10 archivos (los mismos formatos que Extracción →
        Markdown: pdf, xlsx, csv, docx, txt, md, rtf, html, xml, jpeg, jpg,
        png, webp, heic, heif, mp3, wav, m4a, ogg) y un campo `questions` con
        el mismo JSON que space-context: array de `{ question, format }`
        (máximo 5 preguntas, 400 caracteres; format ∈ string | int | boolean |
        timestamp | array). Cada archivo se convierte a Markdown y las
        preguntas se responden cruzando esos textos. No usa schema_id.
        `window_context`, `window_time` y `space_id` son opcionales en este
        endpoint: si window_context es true el documento se conserva durante
        window_time y, si llega space_id, se asocia a ese espacio. infinity
        exige el modo persistente activo en la cuenta. La conversión a Markdown
        no usa estos campos; usa save. La respuesta es `{ user_ask, ia_response,
        documents_processed, log_id }`. Si la verificación de fuente está
        activada en consulta a espacio de conocimiento, cada ítem de
        `ia_response` es `{ value, source }`.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context/multi-document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MultiDocumentRequest'
      responses:
        '200':
          description: Preguntas respondidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiDocumentSuccessResponse'
        '400':
          description: >
            Falta questions o el archivo, hay más de 10 documentos, formato
            no soportado, window_time inválido, space_id sin window_context,
            o infinity sin modo persistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key inválida o cuenta no activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: space_id inexistente para esta cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Algún archivo supera el límite de su formato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Algún archivo no produjo Markdown legible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /excel-json:
    post:
      operationId: excelToJson
      tags:
        - Excel a JSON
      summary: Convierte un archivo Excel o CSV a JSON según un schema
      description: >
        Recibe un archivo .xlsx o .csv y un schema_id, y devuelve los datos
        transformados en JSON con las claves exactamente iguales a las
        propiedades definidas en el schema. Si el archivo tiene varias hojas,
        solo se procesa la primera. La respuesta incluye `log_id`. Si el schema
        tiene la verificación de fuente activada, cada propiedad extraída es
        `{ value, source }` en lugar de un valor plano.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExcelJsonRequest'
      responses:
        '200':
          description: Archivo procesado y transformado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcelJsonSuccessResponse'
        '400':
          description: Petición inválida (archivo o schema_id incorrectos/faltantes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
