        description: Base pública Modo Agente
    post:
      operationId: agentTxtToJson
      tags:
        - Modo Agente
      summary: Txt / HTML / XML a JSON con extracción y razonamiento Modo Agente
      description: >
        Equivalente a POST /api/txt-json más fase agente. Recibe content +
        schema_id (multipart). Devuelve data[], log_id y agent_data. Requiere
        is_agent_mode. Si la verificación de fuente está activada en el schema, data y agent_data usan
        `{ value, source }`. Máximo 300.000 caracteres. URL pública:
        POST https://claix.dev/agent/txt-json. Misma tarifa que extracción
        txt-json (€0,10 por llamada exitosa tras el free tier).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TxtJsonRequest'
      responses:
        '200':
          description: Extracción y fase agente completadas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDocJsonSuccessResponse'
        '400':
          description: Petición inválida, schema sin Modo Agente, o agent_definition inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: El contenido supera 300.000 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: No se pudo extraer datos del contenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA (extracción o fase agente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /agent/audio-json:
    servers:
      - url: https://claix.dev
        description: Base pública Modo Agente
    post:
      operationId: agentAudioToJson
      tags:
        - Modo Agente
      summary: Audio a JSON con extracción y razonamiento Modo Agente
      description: >
        Equivalente a POST /api/audio-json más fase agente. Devuelve data[],
        log_id y agent_data. Requiere is_agent_mode. Si la verificación de fuente está activada en el schema,
        data y agent_data usan `{ value, source }`. Formatos: MP3, WAV, M4A,
        OGG. Tamaño máximo: 12 MB. Duración máxima: 10 minutos.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioJsonRequest'
      responses:
        '200':
          description: Extracción y fase agente completadas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAudioJsonSuccessResponse'
        '400':
          description: >
            Petición inválida, schema sin Modo Agente, o agent_definition
            inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: El audio supera el tamaño máximo (12 MB) o la duración máxima (10 minutos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Audio ininteligible o sin datos extraíbles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA (extracción o fase agente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /schemas:
    get:
      operationId: listSchemas
      tags:
        - Schemas
      summary: Devuelve todos los schemas de la cuenta asociada al API key
      description: >
        Endpoint de solo lectura, sin body ni parámetros. Llama
        `GET https://claix.dev/api/schemas`. Dado un API key válido,
        devuelve la lista completa de schemas creados por el usuario dueño
        de esa key, con toda su información (id, nombre, tipo y definición),
        ordenados del más reciente al más antiguo. Esta llamada es gratuita:
        no se factura ni consume el cupo de extracciones.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/schemas/get-schemas
      responses:
        '200':
          description: Lista de schemas obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemasListResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite GET)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /get-schema/{schema_id}:
    get:
      operationId: getSchema
      tags:
        - Schemas
      summary: Devuelve un schema concreto de la cuenta asociada al API key
      description: >
        Endpoint de solo lectura. Llama
        `GET https://claix.dev/api/get-schema/{schema_id}`. Dado un API key
        válido y un `schema_id` en la URL, devuelve ese schema con toda su
        información (id, nombre, tipo, definición, Modo Agente, ventana de
        contexto y verificación de fuente) si pertenece a la cuenta. Esta
        llamada es gratuita: no se factura ni consume el cupo de extracciones.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/schemas/get-schema
      parameters:
        - name: schema_id
          in: path
          required: true
          description: UUID del schema a consultar
          schema:
            type: string
            format: uuid
            example: b980cfe7-61ef-4a5a-9724-881c8a5541e2
      responses:
        '200':
          description: Schema obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSchemaResponse'
        '400':
          description: Falta schema_id en la URL o no es un UUID válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite GET)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /create-schema:
    post:
      operationId: createSchema
      tags:
        - Schemas
      summary: Crea un schema en la cuenta asociada al API key
      description: >
        Llama `POST https://claix.dev/api/create-schema`. Crea un schema
        listo para usar en los endpoints de extracción o Modo Agente.
        `name`, `type` y `schema_definition`
        son obligatorios. Si `is_agent_mode` es true (o se envía
        `agent_definition`), hay que incluir `agent_definition` con al
        menos un parámetro. El tipo json-excel no admite Modo Agente. Esta
        llamada es gratuita: no se factura ni consume el cupo de extracciones.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/schemas/create-schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchemaRequest'
            example:
              name: DNI cliente
              type: img-json
              schema_definition:
                nombre_dni:
                  type: string
                  description: nombre de la persona del dni
                numero_dni:
                  type: string
                  description: numero de dni
                fecha_caducidad:
                  type: string
                  description: fecha de caducidad del dni
              is_agent_mode: true
              agent_definition:
                edad:
                  type: integer
                  description: Edad exacta de la persona pero restale 3
                calidad_foto:
                  type: closed
                  options:
                    - buena calidad
                    - mala calidad
                    - ilegible
                    - perfecta
                  description: La calidad de la imagen y la legibilidad de sus datos
                es_mayor_edad:
                  type: boolean
                  description: Es mayor de edad actualmente la persona del dni?
                fecha_vencimiento:
                  type: string
                  description: Cuado le vence el dni y cuanto tiempo queda para ello
              resumen_agent: Extrae los datos visibles del DNI y razona sobre caducidad.
      responses:
        '201':
          description: Schema creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSchemaResponse'
        '400':
          description: Payload inválido (campos faltantes o definición incorrecta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /update-schema/{schema_id}:
    put:
      operationId: updateSchema
      tags:
        - Schemas
      summary: Actualiza un schema de la cuenta asociada al API key
      description: >
        Llama `PUT https://claix.dev/api/update-schema/{schema_id}` (también
        se admite POST). Sustituye la configuración completa del schema
        identificado en la URL con el mismo cuerpo que
        `POST /api/create-schema`: `name`, `type` y `schema_definition` son
        obligatorios. Si `is_agent_mode` es true (o se envía
        `agent_definition`), hay que incluir `agent_definition` con al
        menos un parámetro. El tipo json-excel no admite Modo Agente. Esta
        llamada es gratuita: no se factura ni consume el cupo de extracciones.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/schemas/update-schema
      parameters:
        - name: schema_id
          in: path
          required: true
          description: UUID del schema a actualizar
          schema:
            type: string
            format: uuid
            example: b980cfe7-61ef-4a5a-9724-881c8a5541e2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchemaRequest'
            example:
              name: DNI cliente
              type: img-json
              schema_definition:
                nombre_dni:
                  type: string
                  description: nombre de la persona del dni
                numero_dni:
                  type: string
                  description: numero de dni
                fecha_caducidad:
                  type: string
                  description: fecha de caducidad del dni
              is_agent_mode: true
              agent_definition:
                edad:
                  type: integer
                  description: Edad exacta de la persona pero restale 3
                calidad_foto:
                  type: closed
                  options:
                    - buena calidad
                    - mala calidad
                    - ilegible
                    - perfecta
                  description: La calidad de la imagen y la legibilidad de sus datos
                es_mayor_edad:
                  type: boolean
                  description: Es mayor de edad actualmente la persona del dni?
                fecha_vencimiento:
                  type: string
                  description: Cuado le vence el dni y cuanto tiempo queda para ello
              resumen_agent: Extrae los datos visibles del DNI y razona sobre caducidad.
      responses:
        '200':
          description: Schema actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSchemaResponse'
        '400':
          description: Payload inválido (campos faltantes o definición incorrecta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite PUT o POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /delete-schema:
    post:
      operationId: deleteSchema
      tags:
        - Schemas
      summary: Elimina un schema de la cuenta asociada al API key
      description: >
        Llama `POST https://claix.dev/api/delete-schema`. Borra el schema
        identificado por `schema_id` si pertenece a la cuenta del API key.
        También admite DELETE y el
        query param `?schema_id=<uuid>`. Esta llamada es gratuita: no se
        factura ni consume el cupo de extracciones.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/schemas/delete-schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSchemaRequest'
            example:
              schema_id: b980cfe7-61ef-4a5a-9724-881c8a5541e2
      responses:
        '200':
          description: Schema eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSchemaResponse'
        '400':
          description: Falta schema_id o no es un UUID válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST o DELETE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        API key secreta de servidor. Tiene prioridad sobre Authorization
        si se envían ambos headers.
    BearerAuth:
      type: http
      scheme: bearer
      description: Forma alternativa de enviar la API key como Bearer token.

  schemas:
    MarkdownFileRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Archivo a convertir. Los formatos admitidos dependen del endpoint.
        save:
          type: boolean
          description: >
            Si es true, el Markdown se inserta en la base conectada según las
            reglas activas de Markdown y la respuesta incluye row_id. Si no
            viene, o es false, solo se devuelve el Markdown. space_id,
            window_time y window_context se rechazan.
    MarkdownContentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: Texto plano, HTML o XML. Máximo 300000 caracteres.
        save:
          type: boolean
          description: Igual que en MarkdownFileRequest.
    MarkdownSuccessResponse:
      type: object
      required: [success, markdown]
      properties:
        success:
          type: boolean
          example: true
        markdown:
          type: string
          description: Documento convertido a Markdown.
        total_filas_procesadas:
          type: integer
          description: Solo en Excel/CSV → Markdown. Filas de la primera hoja.
        row_id:
          type: string
          description: >
            Presente solo si save era true. Id de la fila insertada en la base conectada.
        log_id:
          type: string
          format: uuid
    ExcelJsonRequest:
      type: object
      required:
        - file
        - schema_id
      properties:
        file:
          type: string
          format: binary
          description: Archivo Excel (.xlsx) o CSV (.csv) a transformar.
        schema_id:
          type: string
          format: uuid
          description: >
            Identificador del schema (previamente creado) de tipo
            "Excel/CSV a JSON".
          example: 8f14e45f-ceea-4e6f-8b23-1e2d3c4b5a6f
        space_id:
          type: string
          format: uuid
          description: >
            Opcional. Espacio de conocimiento al que se asocia el documento
            guardado. Debe pertenecer al mismo usuario dueño de la API key.
            Solo tiene efecto cuando el schema tiene la ventana de contexto
            activada, que es cuando el documento se guarda.
          example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c

    ExcelJsonSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        schema_utilizado:
          type: string
          description: Nombre del schema aplicado.
          example: Leads de Ventas
        total_filas_procesadas:
          type: integer
          description: Número de filas de datos transformadas.
          example: 247
        mapa_columnas:
          type: object
          description: >
            Diccionario que muestra qué columna original se emparejó con
            qué propiedad del schema.
          additionalProperties:
            type: string
          example:
            Nom_cliente: nombre_completo
            Tlf: telefono_movil
            mail de contacto: email_contacto
        data:
          type: array
          description: >
            Registros transformados según el schema. Si la verificación de
            fuente está activada en el schema, cada propiedad es un objeto { value, source } (source cita
            columna y fila; si no hay evidencia, requires_human_revision).
            Si la verificación de fuente está desactivada, los valores siguen siendo planos.
          items:
            type: object
            additionalProperties: true
          example:
            - nombre_completo: Ana María Gómez
              cargo: CEO & Founder
              empresa: TechSolutions
              email_contacto: ana.gomez@techsolutions.com
              telefono_movil: "+1 (555) 019-2231"
        log_id:
          $ref: '#/components/schemas/LogId'

    JsonExcelMultipartRequest:
      type: object
      required:
        - schema_id
      properties:
        schema_id:
          type: string
          format: uuid
          description: >
            Identificador del schema (previamente creado) de tipo
            "JSON a Excel".
          example: 1f9e6103-9221-4c22-8a3a-8592d8b0eb38
        files:
          type: array
          description: >
            Uno o varios archivos o campos de texto con contenido JSON
            (objeto único o array de objetos). Se puede repetir este campo
            o usar nombres de campo distintos; todos los que contengan JSON
            válido son tenidos en cuenta.
          items:
            type: string
            format: binary

    JsonExcelArrayRequest:
      type: array
      description: Forma B.1 -- array directo de registros.
      items:
        type: object
        additionalProperties: true
      example:
        - nombre: Laura Fernández
          email: laura@nebulatech.com
        - nombre: Miguel Gómez
          email: m.gomez@construred.es

    JsonExcelSingleObjectRequest:
      type: object
      description: Forma B.2 -- un único objeto de registro.
      additionalProperties: true
      example:
        nombre: Laura Fernández
        email: laura@nebulatech.com

    JsonExcelEnvelopeRequest:
      type: object
      description: >
        Forma B.3 -- "sobre" con el schema_id incluido y los datos dentro
        de "data" (o, de forma equivalente, "records").
      required:
        - schema_id
        - data
      properties:
        schema_id:
          type: string
          format: uuid
          example: 1f9e6103-9221-4c22-8a3a-8592d8b0eb38
        data:
          type: array
          items:
            type: object
            additionalProperties: true
          example:
            - nombre: Laura Fernández
              email: laura@nebulatech.com
            - nombre: Miguel Gómez
              email: m.gomez@construred.es
        records:
          type: array
          description: Alternativa equivalente a "data".
          items:
            type: object
            additionalProperties: true

    PdfJsonRequest:
      type: object
      required:
        - file
        - schema_id
      properties:
        file:
          type: string
          format: binary
          description: >
            Archivo PDF a analizar (texto seleccionable o escaneado).
            Tamaño máximo admitido: 15 MB.
        schema_id:
          type: string
          format: uuid
          description: >
            Identificador del schema (previamente creado) de tipo
            "PDF a JSON".
          example: 3c7a9f21-4b8e-4d1a-9c6f-2e0d8a5b7c4f
        space_id:
          type: string
          format: uuid
          description: >
            Opcional. Espacio de conocimiento al que se asocia el documento
            guardado. Debe pertenecer al mismo usuario dueño de la API key.
            Solo tiene efecto cuando el schema tiene la ventana de contexto
            activada, que es cuando el documento se guarda.
          example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c

    PdfJsonSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        schema_utilizado:
          type: string
          description: Nombre del schema aplicado.
          example: Facturas de Proveedores
        total_registros:
          type: integer
          description: >
            Siempre 1 en este endpoint: el documento completo se trata como
            una única fuente de datos, no como una tabla de múltiples filas.
          example: 1
        data:
          type: array
          description: >
            Contiene exactamente un objeto con los datos extraídos del PDF,
            según las propiedades definidas en el schema. Los datos no
            encontrados en el documento se devuelven como null. Si la
            verificación de fuente está activada en el schema, cada propiedad es { value, source }
            (source cita página, párrafo o línea).
          items:
            type: object
            additionalProperties: true
          example:
            - numero_factura: F-2026-00456
              fecha_emision: "2026-03-14"
              proveedor: Suministros Industriales del Ebro S.L.
              importe_total: 1284.50
              moneda: EUR
        log_id:
          $ref: '#/components/schemas/LogId'

    DocJsonRequest:
      type: object
      required:
        - file
        - schema_id
      properties:
        file:
          type: string
          format: binary
          description: >
            Archivo de documento a analizar. Formatos admitidos: .docx
            (application/vnd.openxmlformats-officedocument.wordprocessingml.document),
            .txt (text/plain), .md (text/markdown) y .rtf (application/rtf).
            El formato legacy .doc (application/msword) NO está soportado.
            Tamaño máximo admitido: 10 MB.
        schema_id:
          type: string
          format: uuid
          description: >
            Identificador del schema (previamente creado) de tipo
            "Documento a JSON".
          example: b980cfe7-61ef-4a5a-9724-881c8a5541e2
        space_id:
          type: string
          format: uuid
          description: >
            Opcional. Espacio de conocimiento al que se asocia el documento
            guardado. Debe pertenecer al mismo usuario dueño de la API key.
            Solo tiene efecto cuando el schema tiene la ventana de contexto
            activada, que es cuando el documento se guarda.
          example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c

    DocJsonSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        schema_utilizado:
          type: string
          description: Nombre del schema aplicado.
          example: Contratos de Alquiler
        total_registros:
          type: integer
          description: >
            Siempre 1 en este endpoint: el documento completo se trata como
            una única fuente de datos, no como una tabla de múltiples filas.
          example: 1
        data:
          type: array
          description: >
            Contiene exactamente un objeto con los datos extraídos del
            documento, según las propiedades definidas en el schema. Los
            datos no encontrados en el texto se devuelven como null. Si la
            verificación de fuente está activada en el schema, cada propiedad es { value, source }
            (source cita página, párrafo y línea).
          items:
            type: object
            additionalProperties: true
          example:
            - nombre_arrendatario: Laura Fernández Ruiz
              nombre_arrendador: Inversiones Delta S.L.
              direccion_inmueble: Calle Mayor 14, 3ºB, Madrid
              renta_mensual: 950.00
              fecha_inicio: "2026-04-01"
        log_id:
          $ref: '#/components/schemas/LogId'

    TxtJsonRequest:
      type: object
      required:
        - content
        - schema_id
      properties:
        content:
          type: string
          description: >
            Texto plano, HTML o XML ya procesado. No es un archivo. Máximo
            300.000 caracteres.
          example: "<html><body><h1>Factura F-2026-00456</h1></body></html>"
        schema_id:
          type: string
          format: uuid
          description: >
            Identificador del schema (previamente creado) de tipo txt-json.
          example: b980cfe7-61ef-4a5a-9724-881c8a5541e2
        space_id:
          type: string
          format: uuid
          description: >
            Opcional. Espacio de conocimiento al que se asocia el documento
            guardado. Debe pertenecer al mismo usuario dueño de la API key.
            Solo tiene efecto cuando el schema tiene la ventana de contexto
            activada, que es cuando el documento se guarda.
          example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c

    GetDocumentSuccessResponse:
      type: object
      required:
        - success
        - document_id
        - file_name
        - schema_id
        - processed_at
        - content
      properties:
        success:
          type: boolean
          description: Siempre true cuando el código HTTP es 200.
          example: true
        document_id:
          type: string
          format: uuid
          description: Identificador del documento consultado, igual al de la URL.
          example: d4a1e9d2-8b1c-4f3e-9a02-8b1e9f3c7a4b
        file_name:
          type: string
          description: Nombre del archivo original tal como se subió al procesarlo.
          example: dni_cliente_ana.jpg
        schema_id:
          type: string
          format: uuid
          description: Schema usado para procesar este documento.
          example: b980cfe7-61ef-4a5a-9724-881c8a5541e2
        processed_at:
          type: string
          format: date-time
          description: Fecha y hora en que se procesó el documento (ISO 8601).
          example: "2026-08-17T13:10:00.000Z"
        content:
          type: string
          description: >
            Contenido bruto del documento (texto o markdown persistido tras la
            extracción).

    DeleteDocumentSuccessResponse:
      type: object
      required:
        - document_id
      properties:
        document_id:
          type: string
          format: uuid
          description: >
            Identificador del documento eliminado, igual al de la URL. No incluye
            campo success: si el borrado no fue posible, la petición termina en
            404 antes de devolver 200.
          example: d4a1e9d2-8b1c-4f3e-9a02-8b1e9f3c7a4b

    TypedContextQuestion:
      type: object
      required:
        - question
        - format
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 400
          description: Texto de la pregunta a responder.
          example: ¿Cuál es la penalización exacta por cancelación anticipada?
        format:
          type: string
          enum:
            - string
            - int
            - boolean
            - timestamp
            - array
          description: >
            Tipo JSON esperado para la respuesta correspondiente. Si el dato
            existe pero no se puede tipar con seguridad, la API devuelve null.
          example: string

    ContextAnswerValue:
      description: >
        Valor tipado según el format de la pregunta: string, int (entero),
        boolean, timestamp (string ISO preferible), array, o null si no está
        o no se puede tipar.
      nullable: true
      oneOf:
        - type: string
        - type: integer
        - type: boolean
        - type: array
          items: {}

    WindowContextRequest:
      type: object
      required:
        - questions
      properties:
        questions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/TypedContextQuestion'
          description: >
            Preguntas tipadas a responder usando solo el markdown persistido.
            Máximo 5 por turno, 400 caracteres por question. Cada ítem exige
            question y format (string | int | boolean | timestamp | array).
          example:
            - question: ¿Cuál es la penalización exacta por cancelación anticipada?
              format: string
            - question: ¿Qué empresa figura como arrendataria y cuál es su CIF?
              format: string

    WindowContextSuccessResponse:
      type: object
      required:
        - user_ask
        - ia_response
      properties:
        user_ask:
          type: array
          items:
            $ref: '#/components/schemas/TypedContextQuestion'
          description: Preguntas enviadas (con su format), en el mismo orden.
          example:
            - question: ¿Cuál es la penalización exacta por cancelación anticipada?
              format: string
            - question: ¿Qué empresa figura como arrendataria y cuál es su CIF?
              format: string
        ia_response:
          type: array
          description: >
            Respuestas alineadas 1:1 con user_ask, tipadas según format
            (string, int, boolean, timestamp, array) o null. Si la verificación
            de fuente está activada en consulta a documentos, cada ítem es
            { value, source }: source cita el fragmento del markdown (texto
            plano); si no hay evidencia, requires_human_revision.
          items:
            oneOf:
              - $ref: '#/components/schemas/ContextAnswerValue'
              - $ref: '#/components/schemas/SourcedField'
          example:
            - El 15 % del importe restante del contrato.
            - Inversiones Delta S.L., CIF B12345678
        log_id:
          $ref: '#/components/schemas/LogId'

    CreateSpaceRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            Nombre del espacio de conocimiento. Es el único campo de entrada.
            Máximo 200 caracteres.
          example: Proveedores 2026

    CreateSpaceSuccessResponse:
      type: object
      required:
        - success
        - space
      properties:
        success:
          type: boolean
          example: true
        space:
          type: object
          required:
            - space_id
            - name
            - created_at
          properties:
            space_id:
              type: string
              format: uuid
              description: >
                Identificador del espacio recién creado. Envíalo como
                `space_id` opcional al extraer para agrupar documentos, y en la
                ruta de POST /space-context/{space_id} para preguntar al
                espacio completo.
              example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c
            name:
              type: string
              description: Nombre guardado, ya recortado de espacios sobrantes.
              example: Proveedores 2026
            created_at:
              type: string
              format: date-time
              description: Fecha y hora de creación del espacio.
              example: '2026-09-05T14:32:11.482Z'

    DeleteSpaceSuccessResponse:
      type: object
      required:
        - space_id
      properties:
        space_id:
          type: string
          format: uuid
          description: >
            Identificador del espacio eliminado, igual al de la URL. No incluye
            campo success: si el borrado no fue posible, la petición termina en
            404 antes de devolver 200.
          example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c

    AddSpaceRequest:
      type: object
      required:
        - document_id
        - space_id
      properties:
        document_id:
          type: string
          format: uuid
          description: >
            UUID del documento sin space_id. Debe existir y pertenecer a la
            cuenta de la API key.
          example: d4a1e9d2-8b1c-4f3e-9a02-8b1e9f3c7a4b
        space_id:
          type: string
          format: uuid
          description: >
            UUID del espacio de destino, el que devolvió POST /create-space.
          example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c

    AddSpaceSuccessResponse:
      type: object
      required:
        - success
        - document_id
        - space_id
        - space_name
        - file_name
        - version
        - message
      properties:
        success:
          type: boolean
          description: Siempre true en una respuesta 200.
          example: true
        document_id:
          type: string
          format: uuid
          description: Documento asignado al espacio.
          example: d4a1e9d2-8b1c-4f3e-9a02-8b1e9f3c7a4b
        space_id:
          type: string
          format: uuid
          description: Espacio al que se ha añadido el documento.
          example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c
        space_name:
          type: string
          description: Nombre del espacio de destino.
          example: Proveedores 2026
        file_name:
          type: string
          description: Nombre de archivo del documento.
          example: factura.pdf
        version:
          type: number
          description: Versión actual del documento.
          example: 1
        message:
          type: string
          description: Mensaje legible de confirmación.
          example: Documento añadido al espacio de conocimiento.

    ReplaceDocumentRequest:
      type: object
      required:
        - document_id
        - new_content_document_id
      properties:
        document_id:
          type: string
          format: uuid
          description: >
            Documento destino cuyo contenido se sustituye. Conserva su id
            (y su espacio, si lo tiene).
          example: d4a1e9d2-8b1c-4f3e-9a02-8b1e9f3c7a4b
        new_content_document_id:
          type: string
          format: uuid
          description: >
            Documento fuente cuyo contenido se copia. Se elimina tras el swap.
          example: a8c3f1e0-2d4b-4a9e-8c71-5f0e2b9d6a3c

    ReplaceDocumentSuccessResponse:
      type: object
      required:
        - success
        - swap_id
        - document_id
        - source_document_id
        - file_name
        - version
        - swaps_count
        - message
      properties:
        success:
          type: boolean
          description: Siempre true en una respuesta 200.
          example: true
        swap_id:
          type: string
          format: uuid
          description: Identificador de la operación de swap.
          example: c1e7a4b2-9f0d-4e8a-b3c5-1d2e3f4a5b6c
        document_id:
          type: string
          format: uuid
          description: Documento destino (id estable).
          example: d4a1e9d2-8b1c-4f3e-9a02-8b1e9f3c7a4b
        source_document_id:
          type: string
          format: uuid
          description: Documento fuente que se eliminó tras el swap.
          example: a8c3f1e0-2d4b-4a9e-8c71-5f0e2b9d6a3c
        file_name:
          type: string
          description: Nombre de archivo del documento destino.
          example: factura.pdf
        version:
          type: number
          description: Versión incrementada tras el swap.
          example: 2
        swaps_count:
          type: number
          description: Número acumulado de sustituciones del documento destino.
          example: 1
        message:
          type: string
          description: Mensaje legible de confirmación.
          example: Contenido sustituido. El documento fuente ha sido eliminado.

    RemoveDocumentFromSpaceSuccessResponse:
      type: object
      required:
        - success
        - document_id
        - previous_space_id
        - espacio_id
        - file_name
        - version
        - message
      properties:
        success:
          type: boolean
          description: Siempre true en una respuesta 200.
          example: true
        document_id:
          type: string
          format: uuid
          description: Documento desacoplado del espacio.
          example: d4a1e9d2-8b1c-4f3e-9a02-8b1e9f3c7a4b
        previous_space_id:
          type: string
          format: uuid
          description: Espacio del que se ha quitado el documento.
          example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c
        espacio_id:
          type: string
          format: uuid
          nullable: true
          description: Siempre null tras la operación.
          example: null
        file_name:
          type: string
          description: Nombre de archivo del documento.
          example: factura.pdf
        version:
          type: number
          description: Versión actual del documento.
          example: 1
        message:
          type: string
          description: Mensaje legible de confirmación.
          example: Documento desacoplado del espacio. Ahora está sin space_id.

    SpaceContextRequest:
      type: object
      required:
        - questions
      properties:
        questions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/TypedContextQuestion'
          description: >
            Preguntas tipadas a responder usando solo el markdown persistido de
            los documentos del espacio. Mismo formato y mismos límites que
            document-context: máximo 5 por turno, 400 caracteres por question,
            con format obligatorio (string | int | boolean | timestamp | array).
          example:
            - question: ¿Qué proveedor factura más en total sumando todas las facturas?
              format: string
            - question: ¿Hay algún contrato cuyo importe no coincida con su factura?
              format: boolean

    SpaceContextSuccessResponse:
      type: object
      required:
        - user_ask
        - ia_response
      properties:
        user_ask:
          type: array
          items:
            $ref: '#/components/schemas/TypedContextQuestion'
          description: Preguntas enviadas (con su format), en el mismo orden.
          example:
            - question: ¿Qué proveedor factura más en total sumando todas las facturas?
              format: string
            - question: ¿Hay algún contrato cuyo importe no coincida con su factura?
              format: boolean
        ia_response:
          type: array
          description: >
            Respuestas alineadas 1:1 con user_ask, tipadas según format o null.
            Si la verificación de fuente está activada en consulta a espacio de
            conocimiento, cada ítem es { value, source } nombrando document_id
            y file_name (y el cruce si aplica). Si no hay evidencia, source es
            requires_human_revision.
          items:
            oneOf:
              - $ref: '#/components/schemas/ContextAnswerValue'
              - $ref: '#/components/schemas/SourcedField'
          example:
            - Suministros Omega S.A., 48.320 € entre tres facturas (feb, mar, abr).
            - true
        log_id:
          $ref: '#/components/schemas/LogId'

    MultiDocumentRequest:
      type: object
      required: [file, questions]
      properties:
        file:
          type: string
          format: binary
          description: >
            Documento a convertir. Se puede repetir el campo hasta 10 veces.
            También se aceptan los nombres files y documents. Formatos: pdf,
            xlsx, csv, docx, txt, md, rtf, html, xml, jpeg, jpg, png, webp,
            heic, heif, mp3, wav, m4a y ogg.
        questions:
          type: string
          description: >
            JSON con un array de { question, format }. Mismos límites que
            space-context: máximo 5 preguntas, 400 caracteres por question,
            format ∈ string | int | boolean | timestamp | array.
          example: >
            [{"question":"¿Qué proveedor factura más en total?","format":"string"}]
        window_context:
          type: boolean
          description: >
            Si es true, cada documento convertido se conserva. Si no viene,
            solo se usan para responder y no se conserva ninguno.
        window_time:
          type: string
          description: >
            Obligatorio si window_context es true. Misma lista de minutos que
            al convertir a Markdown, o "infinity" (exige modo persistente).
        space_id:
          type: string
          format: uuid
          description: >
            Opcional, y solo si window_context es true. Espacio de conocimiento
            al que se asocian los documentos conservados.
    MultiDocumentSuccessResponse:
      type: object
      required:
        - user_ask
        - ia_response
        - documents_processed
      properties:
        user_ask:
          type: array
          items:
            $ref: '#/components/schemas/TypedContextQuestion'
          description: Preguntas enviadas, en el mismo orden.
        ia_response:
          type: array
          description: >
            Respuestas alineadas 1:1 con user_ask, tipadas según format o null.
            Si la verificación de fuente está activada en consulta a espacio de
            conocimiento, cada ítem es { value, source }.
          items:
            oneOf:
              - $ref: '#/components/schemas/ContextAnswerValue'
              - $ref: '#/components/schemas/SourcedField'
        documents_processed:
          type: integer
          description: Número de documentos convertidos y usados para responder.
          example: 3
        log_id:
          $ref: '#/components/schemas/LogId'

    ImgJsonRequest:
      type: object
      required:
        - file
        - schema_id
      properties:
        file:
          type: string
          format: binary
          description: >
            Imagen a analizar. Formatos admitidos: .jpeg, .jpg, .png, .webp,
            .heic y .heif. Tamaño máximo admitido: 15 MB.
        schema_id:
          type: string
          format: uuid
          description: >
            Identificador del schema (previamente creado) de tipo
            "Imagen a JSON".
          example: 3c7a9f21-4b8e-4d1a-9c6f-2e0d8a5b7c4f
        space_id:
          type: string
          format: uuid
          description: >
            Opcional. Espacio de conocimiento al que se asocia el documento
            guardado. Debe pertenecer al mismo usuario dueño de la API key.
            Solo tiene efecto cuando el schema tiene la ventana de contexto
            activada, que es cuando el documento se guarda.
          example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c

    ImgJsonSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        schema_utilizado:
          type: string
          description: Nombre del schema aplicado.
          example: Facturas de Proveedores
        total_registros:
          type: integer
          description: >
            Siempre 1 en este endpoint: la imagen completa se trata como
            una única fuente de datos, no como una tabla de múltiples filas.
          example: 1
        data:
          type: array
          description: >
            Contiene exactamente un objeto con los datos extraídos de la
            imagen, según las propiedades definidas en el schema. Los datos
            no encontrados se devuelven como null. Si la verificación de fuente está activada en el schema,
            cada propiedad es { value, source } (zona o etiqueta visible).
          items:
            type: object
            additionalProperties: true
          example:
            - numero_factura: F-2026-00456
              fecha_emision: "2026-03-14"
              proveedor: Suministros Industriales del Ebro S.L.
              importe_total: 1284.50
              moneda: EUR
        log_id:
          $ref: '#/components/schemas/LogId'

    AudioJsonRequest:
      type: object
      required:
        - file
        - schema_id
      properties:
        file:
          type: string
          format: binary
          description: >
            Audio a analizar. Formatos admitidos: .mp3, .wav, .m4a y .ogg.
            Tamaño máximo admitido: 12 MB. Duración máxima: 10 minutos.
        schema_id:
          type: string
          format: uuid
          description: >
            Identificador del schema (previamente creado) de tipo
            "Audio a JSON".
          example: 3c7a9f21-4b8e-4d1a-9c6f-2e0d8a5b7c4f
        space_id:
          type: string
          format: uuid
          description: >
            Opcional. Espacio de conocimiento al que se asocia el documento
            guardado. Debe pertenecer al mismo usuario dueño de la API key.
            Solo tiene efecto cuando el schema tiene la ventana de contexto
            activada, que es cuando el documento se guarda.
          example: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c

    AudioJsonSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        schema_utilizado:
          type: string
          description: Nombre del schema aplicado.
          example: Notas de llamada
        total_registros:
          type: integer
          description: >
            Siempre 1 en este endpoint: el audio completo se trata como
            una única fuente de datos.
          example: 1
        data:
          type: array
          description: >
            Contiene exactamente un objeto con los datos extraídos del
            audio, según las propiedades definidas en el schema. Los datos
            no encontrados se devuelven como null. Si la verificación de fuente está activada en el schema,
            cada propiedad es { value, source } (fragmento hablado o momento).
          items:
            type: object
            additionalProperties: true
          example:
            - cliente: Suministros Industriales del Ebro S.L.
              numero_factura: F-2026-00456
              fecha_emision: "2026-03-14"
              importe_total: 1284.50
        log_id:
          $ref: '#/components/schemas/LogId'

    SourcedField:
      type: object
      required:
        - value
        - source
      properties:
        value:
          description: >
            Dato extraído o respuesta. null si no se encontró o no es
            determinable.
          nullable: true
        source:
          type: string
          description: >
            Evidencia de dónde se encontró el valor. Si no hay evidencia,
            el valor exacto es requires_human_revision.
          example: "página 2, párrafo 3"

    LogId:
      type: string
      format: uuid
      nullable: true
      description: >
        Identificador del registro en usage_logs de esta llamada. Presente
        en respuestas de éxito de extracción, modo agente, document-context
        y space-context, y en la mayoría de errores una vez autenticada la
        petición. Puede omitirse si el insert del log falla.
      example: 7c2e1a90-4b3d-4f8a-9e21-6d5c8b0a1f34

    AgentData:
      type: object
      description: >
        Respuestas tipadas de la fase Modo Agente según agent_definition del
        schema. Las claves coinciden con los nombres definidos en el dashboard;
        los tipos dependen de cada campo (boolean, integer, string u opción
        cerrada). Opcionalmente puede incluir resumen_agent como string si está
        configurado en el schema. Si la verificación de fuente está activada en el schema, cada campo (salvo
        resumen_agent si se pide como texto plano) es { value, source }.
      additionalProperties: true
      example:
        clausula_penalizacion: true
        salario: 55000
        es_parcial: false
        resumen_contrato: "Contrato indefinido con jornada completa."

    AgentExcelJsonSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ExcelJsonSuccessResponse'
        - type: object
          required:
            - agent_data
          properties:
            agent_data:
              $ref: '#/components/schemas/AgentData'

    AgentPdfJsonSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/PdfJsonSuccessResponse'
        - type: object
          required:
            - agent_data
          properties:
            agent_data:
              $ref: '#/components/schemas/AgentData'

    AgentDocJsonSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/DocJsonSuccessResponse'
        - type: object
          required:
            - agent_data
          properties:
            agent_data:
              $ref: '#/components/schemas/AgentData'

    AgentImgJsonSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ImgJsonSuccessResponse'
        - type: object
          required:
            - agent_data
          properties:
            agent_data:
              $ref: '#/components/schemas/AgentData'

    AgentAudioJsonSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/AudioJsonSuccessResponse'
        - type: object
          required:
            - agent_data
          properties:
            agent_data:
              $ref: '#/components/schemas/AgentData'

    AgentFieldDefinition:
      type: object
      required:
        - type
        - description
      properties:
        type:
          type: string
          enum:
            - boolean
            - string
            - closed
            - integer
          description: Tipo de respuesta esperada para este campo agente.
        description:
          type: string
          description: Instrucción semántica para el modelo en la fase agente.
        options:
          type: array
          items:
            type: string
          description: >
            Valores permitidos cuando type es "closed"; el modelo debe devolver
            exactamente una de estas opciones.

    SchemaFieldDefinition:
      type: object
      required:
        - type
        - description
      properties:
        type:
          type: string
          enum:
            - string
            - integer
            - number
            - boolean
          description: Tipo JSON del campo extraído.
        description:
          type: string
          description: Descripción semántica que ayuda a localizar el valor en el documento.

    SchemaItem:
      type: object
      description: Un schema tal como está almacenado en la cuenta.
      properties:
        id:
          type: string
          format: uuid
          example: b980cfe7-61ef-4a5a-9724-881c8a5541e2
        name:
          type: string
          example: Facturas Trimestrales
        type:
          type: string
          description: >
            Dirección de conversión para la que está pensado este schema.
          enum:
            - excel-json
            - json-excel
            - pdf-json
            - doc-json
            - img-json
            - txt-json
            - audio-json
          example: pdf-json
        schema_definition:
          type: object
          description: >
            Definición de las propiedades del schema (jsonb), cada una con
            su "type" y, opcionalmente, una "description" que ayuda al
            reconocimiento semántico en los endpoints de conversión.
          additionalProperties: true
          example:
            nif_cliente:
              type: string
              description: NIF o CIF del cliente facturado.
        is_agent_mode:
          type: boolean
          description: >
            Si es true, el schema puede usarse con los endpoints /agent/*-json.
          example: false
        agent_definition:
          type: object
          description: >
            Definición de campos para la fase Modo Agente (solo relevante si
            is_agent_mode es true). Cada clave es el nombre del campo en
            agent_data.
          additionalProperties:
            $ref: '#/components/schemas/AgentFieldDefinition'
          nullable: true
          example:
            clausula_penalizacion:
              type: boolean
              description: Indica si el contrato incluye cláusula de penalización.
        resumen_agent:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Texto opcional con instrucciones adicionales para el resumen o
            razonamiento del Modo Agente.
          example: null
        window_context:
          type: boolean
          description: >
            Si es true, el schema mantiene una ventana temporal de contexto
            activa sobre el documento procesado.
          example: false
        window_time:
          oneOf:
            - type: number
              enum: [5, 10, 15, 30, 45, 60, 90, 120, 180, 240, 360, 480, 720, 1440, 0]
            - type: string
              enum: [infinity]
          nullable: true
          description: >
            Duración de la ventana en minutos cuando window_context es true.
            Valores admitidos: 5, 10, 15, 30, 45, 60, 90, 120, 180, 240,
            360, 480, 720, 1440. También puedes enviar 0 o la cadena
            `infinity` para ventana sin caducidad; en ese caso la cuenta debe
            tener modo persistente activo (users.infinity_mode = true). Se
            guarda como window_context true y window_time 0.
          example: null
        cita_por_campo:
          type: boolean
          description: >
            Verificación de fuente. Si es true, cada campo extraído (y cada
            campo de agent_data) se devuelve como { value, source }. Por
            defecto false: el formato de salida no cambia.
          example: false
        created_at:
          type: string
          format: date-time
          example: "2026-08-06T09:51:41.372964+00:00"

    SchemasListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        total_schemas:
          type: integer
          description: Número total de schemas devueltos.
          example: 5
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/SchemaItem'

    CreateSchemaRequest:
      type: object
      required:
        - name
        - type
        - schema_definition
      properties:
        name:
          type: string
          maxLength: 200
          description: Nombre visible del schema.
          example: DNI cliente
        type:
          type: string
          enum:
            - excel-json
            - json-excel
            - pdf-json
            - doc-json
            - img-json
            - txt-json
            - audio-json
          description: Tipo de conversión para el que se usará este schema.
          example: img-json
        schema_definition:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SchemaFieldDefinition'
          description: >
            Campos a extraer. Cada clave es el nombre de la propiedad JSON
            resultante; cada valor tiene type (string, integer, number o
            boolean) y description.
        is_agent_mode:
          type: boolean
          description: >
            Activa el Modo Agente. Si omites este campo pero envías
            agent_definition, se asume true.
          example: true
        agent_definition:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentFieldDefinition'
          description: >
            Obligatorio si is_agent_mode es true. Cada clave es el nombre
            del campo en agent_data. Types: boolean, string, closed, integer.
            Si type es closed, options es obligatorio.
        resumen_agent:
          type: string
          maxLength: 500
          nullable: true
          description: Instrucción opcional para la fase de razonamiento.
        window_context:
          type: boolean
          description: >
            Activa la ventana temporal de contexto. Por defecto false.
          example: false
        window_time:
          oneOf:
            - type: number
              enum: [5, 10, 15, 30, 45, 60, 90, 120, 180, 240, 360, 480, 720, 1440, 0]
            - type: string
              enum: [infinity]
          nullable: true
          description: >
            Obligatorio si window_context es true. Duración en minutos.
            Valores admitidos: 5, 10, 15, 30, 45, 60, 90, 120, 180, 240,
            360, 480, 720, 1440. También puedes enviar 0 o la cadena
            `infinity` para ventana sin caducidad; requiere modo persistente
            activo en la cuenta. Se persiste como window_time 0.
          example: null
        cita_por_campo:
          type: boolean
          description: >
            Activa la verificación de fuente en las extracciones y en modo
            agente. Por defecto false. Si es true, cada campo de data y
            agent_data es { value, source }.
          example: false

    CreateSchemaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        schema:
          $ref: '#/components/schemas/SchemaItem'

    DeleteSchemaRequest:
      type: object
      required:
        - schema_id
      properties:
        schema_id:
          type: string
          format: uuid
          description: UUID del schema a eliminar.
          example: b980cfe7-61ef-4a5a-9724-881c8a5541e2

    DeleteSchemaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        deleted:
          type: boolean
          example: true
        id:
          type: string
          format: uuid
          example: b980cfe7-61ef-4a5a-9724-881c8a5541e2

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Descripción legible del problema.
          example: No se envió el campo schema_id.
        detalle:
          type: string
          description: Información técnica adicional (solo presente en algunos casos).
          example: "Missing required field 'schema_id' in multipart/form-data body."
        log_id:
          $ref: '#/components/schemas/LogId'
