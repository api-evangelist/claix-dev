            desacoplar.
      responses:
        '200':
          description: Documento desacoplado del espacio correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveDocumentFromSpaceSuccessResponse'
        '400':
          description: >
            document_id ausente o con formato UUID inválido, o el documento ya
            no tiene espacio asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El documento no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (se admiten DELETE y POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

