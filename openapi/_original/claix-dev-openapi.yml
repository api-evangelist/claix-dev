      - url: https://claix.dev
        description: Producción (dominio público Claix)
    post:
      operationId: createSpace
      tags:
        - Espacios de Conocimiento
      summary: Crea un espacio de conocimiento en la cuenta del API key
      description: >
        Equivale a POST https://claix.dev/create-space. Crea un espacio de
        conocimiento vacío en la cuenta de la API key. El único campo
        obligatorio es `name`. Devuelve el `space_id` que luego se envía como
        `space_id` opcional en los endpoints de extracción para agrupar
        documentos, y que identifica el espacio en
        POST /space-context/{space_id}. Cada espacio admite como máximo 10
        documentos. Esta llamada es gratuita: no se factura ni consume el cupo
        de extracciones.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context/create-space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
            example:
              name: Proveedores 2026
      responses:
        '201':
          description: Espacio de conocimiento creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSpaceSuccessResponse'
        '400':
          description: Payload inválido (name ausente, vacío o demasiado largo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /delete-space/{space_id}:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    delete:
      operationId: deleteSpace
      tags:
        - Espacios de Conocimiento
      summary: Elimina un espacio de conocimiento
      description: >
        Equivale a DELETE https://claix.dev/delete-space/{space_id}. Borra el
        espacio indicado en la ruta, filtrando a la vez por espacio y por
        cuenta de la API key, de modo que un espacio ajeno nunca se puede
        borrar. No admite body ni query params. Si no se elimina ninguna fila
        (no existe o es ajeno), responde 404 con mensaje genérico. Llamada
        gratuita.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context/delete-space
      parameters:
        - name: space_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: >
            UUID del espacio de conocimiento a eliminar, el que devolvió
            POST /create-space.
      responses:
        '200':
          description: Espacio de conocimiento eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSpaceSuccessResponse'
        '400':
          description: space_id ausente en la URL o con formato UUID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El espacio no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite DELETE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /add-space:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    post:
      operationId: addSpace
      tags:
        - Espacios de Conocimiento
      summary: Asigna un documento sin espacio a un espacio de conocimiento
      description: >
        Equivale a POST https://claix.dev/add-space. Vincula un documento
        persistido que aún no tiene `space_id` a un espacio de conocimiento
        existente de la misma cuenta. Si el documento ya pertenece a un
        espacio, responde 400. Cada space_id admite como máximo 10 documentos;
        si el espacio está lleno, responde 400. Útil cuando se extrajo sin
        `space_id` y después se quiere agrupar para consultas con POST
        /space-context/{space_id}. Esta llamada es gratuita: no se factura ni
        consume el cupo de extracciones.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context/add-space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSpaceRequest'
            example:
              document_id: d4a1e9d2-8b1c-4f3e-9a02-8b1e9f3c7a4b
              space_id: 5b9e2c14-7d3a-4f8b-9e1c-6a0d4b8f2e7c
      responses:
        '200':
          description: Documento asignado al espacio correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddSpaceSuccessResponse'
        '400':
          description: >
            Payload inválido (UUIDs ausentes o mal formados), el documento ya
            tiene un space_id asignado, o el espacio ya tiene 10 documentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El documento o el espacio no existen o no pertenecen a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /remove-document-from-space/{document_id}:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    delete:
      operationId: removeDocumentFromSpace
      tags:
        - Espacios de Conocimiento
      summary: Desacopla un documento de su espacio de conocimiento
      description: >
        Equivale a DELETE https://claix.dev/remove-document-from-space/{document_id}.
        Pone `espacio_id` a null en el documento indicado: el documento sigue
        existiendo, solo deja de pertenecer al espacio. Sin body ni query
        params. Si el documento ya no tenía espacio asignado, responde 400.
        La edge function también acepta POST con la misma URL y el mismo
        comportamiento. Tras el desacoplado se puede volver a asignar con
        POST /add-space. Llamada gratuita.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context/remove-document-from-space
      parameters:
        - name: document_id
          in: path
