  /agent/excel-json:
    servers:
      - url: https://claix.dev
        description: Base pública Modo Agente
    post:
      operationId: agentExcelToJson
      tags:
        - Modo Agente
      summary: Excel/CSV a JSON con extracción y razonamiento Modo Agente
      description: >
        Equivalente a POST /api/excel-json seguido de una fase agente con Gemini.
        Devuelve la respuesta de extracción (data, mapa_columnas, etc.) más
        agent_data según agent_definition. El schema debe tener is_agent_mode
        activado. Misma petición multipart (file + schema_id) y mismos códigos
        de error que /api/excel-json; además puede devolver 400 si el schema no
        tiene Modo Agente o agent_definition inválida, o 502 si falla la fase
        agente.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExcelJsonRequest'
      responses:
        '200':
          description: Extracción y fase agente completadas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExcelJsonSuccessResponse'
        '400':
          description: >
            Petición inválida, schema sin Modo Agente activado, o
            agent_definition inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: No se encontró correspondencia entre columnas y schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >
            Fallo del servicio de IA (extracción o fase agente Gemini)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

