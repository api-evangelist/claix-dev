openapi: 3.0.3
info:
  title: Claix API
  description: >
    Claix es una API de conversión de datos tabulares, JSON y documentos
    (PDF, Word, texto plano, imágenes) pensada para integraciones server-to-server
    (backends, scripts, herramientas de automatización como n8n, Zapier o
    Make). Expone seis endpoints principales de conversión:

    - **Excel/CSV → JSON**: recibe un archivo Excel o CSV y lo transforma en
      JSON según la estructura definida en un "schema" previamente creado.
    - **JSON → Excel**: recibe uno o varios documentos JSON y devuelve un
      archivo Excel (.xlsx) binario, según la estructura definida en un
      "schema" previamente creado.
    - **PDF → JSON**: recibe un archivo PDF (de texto o escaneado) y devuelve
      un objeto JSON con los datos extraídos del documento, según la
      estructura definida en un "schema" previamente creado.
    - **Documento → JSON**: recibe un archivo de documento (.docx, .txt, .md
      o .rtf) y devuelve un objeto JSON con los datos extraídos, según la
      estructura definida en un "schema" previamente creado.
    - **Imagen → JSON**: recibe una imagen (.jpeg, .jpg, .png, .webp, .heic
      o .heif) y devuelve un objeto JSON con los datos extraídos del
      contenido visible, según la estructura definida en un "schema"
      previamente creado.
    - **Txt / HTML / XML → JSON**: recibe el campo `content` (texto plano,
      HTML o XML ya procesado, sin archivo) y devuelve un objeto JSON con los
      datos extraídos, según un schema de tipo txt-json. Máximo 300.000
      caracteres. Tarifa fija €0,10 por llamada exitosa tras el free tier.

    Además, expone endpoints para consultar y gestionar los schemas
    de la cuenta:

    - **Listar schemas**: dado un API key, devuelve todos los schemas de esa
      cuenta con su información completa (id, nombre, tipo y definición).
    - **Crear schema**: crea un schema con `name`, `type`, `schema_definition`
      y, opcionalmente, Modo Agente (`is_agent_mode`, `agent_definition`,
      `resumen_agent`).
    - **Borrar schema**: elimina un schema de la cuenta por `schema_id`.

    **Ventana de Contexto** — Tras una extracción con `window_context`
    activo, el `document_id` devuelto permite consultar el contenido bruto,
    preguntar al markdown persistido o eliminar el documento:

    - **GET https://claix.dev/get-document/{document_id}**: devuelve el
      contenido bruto y metadatos del documento (`content`, `file_name`,
      `schema_id`, `processed_at`). Llamada gratuita.
    - **POST https://claix.dev/document-context/{document_id}**: body
      `{ "questions": ["..."] }` (máximo 5 preguntas, 400 caracteres cada una).
      Respuesta `{ user_ask, ia_response }`.
    - **DELETE https://claix.dev/delete-document/{document_id}**: elimina el
      documento persistido por `document_id`. Sin body ni query params.
      Respuesta `{ document_id }`. Llamada gratuita.

    **Espacios de Conocimiento** — Los documentos persistidos se pueden agrupar
    en espacios (`space_id` opcional en los endpoints de extracción). Una vez
    agrupados, se puede preguntar al espacio completo en lugar de a un único
    documento:

    - **POST https://claix.dev/create-space**: body `{ "name": "..." }`.
      Crea un espacio y devuelve `{ success, space: { space_id, name,
      created_at } }`. Llamada gratuita.
    - **DELETE https://claix.dev/delete-space/{space_id}**: elimina el espacio.
      Sin body ni query params. Respuesta `{ space_id }`. Llamada gratuita.
    - **POST https://claix.dev/space-context/{space_id}**: body
      `{ "questions": ["..."] }` (máximo 5 preguntas, 400 caracteres cada una),
      exactamente igual que document-context. La diferencia es el alcance: la
      respuesta se construye cruzando el `markdown_content` de todos los
      documentos vigentes del espacio, no de uno solo.
      Respuesta `{ user_ask, ia_response }`.

    Los seis endpoints de conversión usan reconocimiento automático de sinónimos,
    abreviaturas, traducciones y variantes de nombre entre las
    columnas/claves/campos de entrada y las propiedades definidas en el
    schema correspondiente.

    **Modo Agente** — Cinco endpoints adicionales bajo `/agent/*-json` ejecutan
    la misma extracción estructurada que sus equivalentes `/api/*-json` y, a
    continuación, una fase de razonamiento semántico según `agent_definition`
    del schema. La respuesta HTTP 200 incluye los campos habituales de
    extracción más `agent_data` (objeto tipado con booleanos, enteros, strings
    u opciones cerradas). El schema debe tener `is_agent_mode` activado.
  version: "1.8.2"
servers:
  - url: https://claix.dev/api
    description: Producción (dominio público Claix)

security:
  - ApiKeyAuth: []
  - BearerAuth: []

tags:
  - name: Excel a JSON
    description: Conversión de archivos Excel/CSV a JSON estructurado
  - name: JSON a Excel
    description: Conversión de datos JSON a archivos Excel binarios
  - name: PDF a JSON
    description: Extracción de datos estructurados a partir de archivos PDF
  - name: Documento a JSON
    description: >
      Extracción de datos estructurados a partir de documentos de texto
      (.docx, .txt, .md, .rtf)
  - name: Imagen a JSON
    description: >
      Extracción de datos estructurados a partir de imágenes
      (.jpeg, .jpg, .png, .webp, .heic, .heif)
  - name: Texto a JSON
    description: >
      Extracción de datos estructurados a partir de texto plano, HTML o XML
      ya procesado (campo content, sin archivo)
  - name: Ventana de Contexto
    description: >
      Consulta de contenido bruto, preguntas o borrado de un documento persistido
      (markdown_content) identificado por document_id. URLs públicas: GET
      https://claix.dev/get-document/{document_id}; POST
      https://claix.dev/document-context/{document_id}; DELETE
      https://claix.dev/delete-document/{document_id}.
  - name: Espacios de Conocimiento
    description: >
      Creación y borrado de espacios de conocimiento, y preguntas cruzadas
      sobre todos los documentos vigentes agrupados en uno de ellos. El formato
      de entrada y salida de las preguntas es el mismo que en la ventana de
      contexto. URLs públicas: POST https://claix.dev/create-space; DELETE
      https://claix.dev/delete-space/{space_id}; POST
      https://claix.dev/space-context/{space_id}.
  - name: Schemas
    description: Consulta de los schemas creados en la cuenta
  - name: Modo Agente
    description: >
      Extracción estructurada más razonamiento semántico en una sola llamada.
      Requiere schema con is_agent_mode activado y agent_definition configurada.
      URLs públicas: POST /agent/excel-json, /agent/pdf-json, /agent/doc-json,
      /agent/img-json, /agent/txt-json (documentación humana en /documentation/agent/*).

paths:
  /excel-json:
    post:
      operationId: excelToJson
      tags:
        - Excel a JSON
      summary: Convierte un archivo Excel o CSV a JSON según un schema
      description: >
        Recibe un archivo .xlsx o .csv y un schema_id, y devuelve los datos
        transformados en JSON con las claves exactamente iguales a las
        propiedades definidas en el schema. Si el archivo tiene varias hojas,
        solo se procesa la primera.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExcelJsonRequest'
      responses:
        '200':
          description: Archivo procesado y transformado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcelJsonSuccessResponse'
        '400':
          description: Petición inválida (archivo o schema_id incorrectos/faltantes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: No se encontró correspondencia entre columnas y schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA encargado de interpretar el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /json-excel:
    post:
      operationId: jsonToExcel
      tags:
        - JSON a Excel
      summary: Convierte uno o varios documentos JSON a un archivo Excel
      description: >
        Recibe datos JSON (como archivo, texto plano o cuerpo JSON puro) y un
        schema_id, y devuelve un archivo .xlsx binario con las columnas en el
        orden y nombres definidos por el schema. Admite multipart/form-data
        (uno o varios campos con JSON) o application/json puro (array,
        objeto único, o sobre con schema_id + data/records).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JsonExcelMultipartRequest'
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/JsonExcelArrayRequest'
                - $ref: '#/components/schemas/JsonExcelSingleObjectRequest'
                - $ref: '#/components/schemas/JsonExcelEnvelopeRequest'
      parameters:
        - name: schema_id
          in: query
          required: false
          description: >
            UUID del schema a utilizar. Alternativa a incluirlo en el cuerpo
            JSON (solo aplica cuando se usa application/json puro sin sobre).
          schema:
            type: string
            format: uuid
            example: 1f9e6103-9221-4c22-8a3a-8592d8b0eb38
      responses:
        '200':
          description: Archivo Excel generado correctamente (respuesta binaria)
          headers:
            Content-Disposition:
              description: Nombre de archivo sugerido basado en el nombre del schema
              schema:
                type: string
                example: 'attachment; filename="Leads de Ventas.xlsx"'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Petición inválida (datos JSON o schema_id incorrectos/faltantes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: No se encontró correspondencia entre claves y schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA encargado de interpretar los datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pdf-json:
    post:
      operationId: pdfToJson
      tags:
        - PDF a JSON
      summary: Extrae datos estructurados de un archivo PDF según un schema
      description: >
        Recibe un archivo .pdf (de texto seleccionable o escaneado) y un
        schema_id, y devuelve un único objeto JSON con los datos extraídos
        del documento completo, con las claves exactamente iguales a las
        propiedades definidas en el schema. A diferencia de excel-json, el
        documento se trata como una única fuente de datos: la respuesta
        siempre contiene exactamente un registro en "data", nunca una fila
        por cada elemento del documento. El tamaño máximo de archivo admitido
        es 15 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PdfJsonRequest'
      responses:
        '200':
          description: PDF analizado y datos extraídos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfJsonSuccessResponse'
        '400':
          description: >
            Petición inválida (archivo faltante, no es un PDF válido, PDF
            vacío, o schema_id incorrecto/faltante/de tipo equivocado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: El PDF supera el tamaño máximo admitido (15 MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            No se pudo extraer ningún dato del PDF relacionado con el schema
            indicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA encargado de analizar el PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /doc-json:
    post:
      operationId: docToJson
      tags:
        - Documento a JSON
      summary: Extrae datos estructurados de un documento de texto según un schema
      description: >
        Recibe un archivo de documento (.docx, .txt, .md o .rtf) y un
        schema_id, y devuelve un único objeto JSON con los datos extraídos
        del documento completo, con las claves exactamente iguales a las
        propiedades definidas en el schema. El texto se extrae de forma
        determinista en el servidor ANTES de llamar a la IA (desempaquetado
        del .docx, decodificación UTF-8 para .txt/.md, stripping de códigos
        de control para .rtf); solo el texto plano resultante se envía al
        modelo. El formato legacy .doc (Word 97-2003) no está soportado.
        Igual que en pdf-json, el documento se trata como una única fuente
        de datos: la respuesta siempre contiene exactamente un registro en
        "data". El tamaño máximo de archivo admitido es 10 MB, y el texto
        extraído no puede superar los 300.000 caracteres.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocJsonRequest'
      responses:
        '200':
          description: Documento analizado y datos extraídos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocJsonSuccessResponse'
        '400':
          description: >
            Petición inválida (archivo faltante, formato no soportado,
            documento vacío o sin texto extraíble, .doc legacy sin
            convertir, .docx corrupto, o schema_id incorrecto/faltante/de
            tipo equivocado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: >
            El archivo supera el tamaño máximo admitido (10 MB), o el texto
            extraído supera el límite de 300.000 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            No se pudo extraer ningún dato del documento relacionado con el
            schema indicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA encargado de analizar el texto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /img-json:
    post:
      operationId: imgToJson
      tags:
        - Imagen a JSON
      summary: Extrae datos estructurados de una imagen según un schema
      description: >
        Recibe una imagen (.jpeg, .jpg, .png, .webp, .heic o .heif) y un
        schema_id, y devuelve un único objeto JSON con los datos extraídos
        del contenido visible, con las claves exactamente iguales a las
        propiedades definidas en el schema. El análisis lo realiza un modelo
        multimodal de IA. Antes de extraer datos, el modelo evalúa si la
        imagen es legible (nitidez, enfoque, iluminación); si no lo es,
        responde con 422. Igual que en pdf-json, la imagen se trata como una
        única fuente de datos: la respuesta siempre contiene exactamente un
        registro en "data". El tamaño máximo de archivo admitido es 15 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImgJsonRequest'
      responses:
        '200':
          description: Imagen analizada y datos extraídos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImgJsonSuccessResponse'
        '400':
          description: >
            Petición inválida (archivo faltante, formato no soportado,
            imagen vacía, corrupta, firma binaria incoherente, o
            schema_id incorrecto/faltante/de tipo equivocado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: La imagen supera el tamaño máximo admitido (15 MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Imagen ilegible (borrosa, desenfocada, mal iluminada) o sin
            datos extraíbles según el schema indicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA encargado de analizar la imagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /txt-json:
    post:
      operationId: txtToJson
      tags:
        - Texto a JSON
      summary: Extrae datos estructurados de Txt / HTML / XML según un schema
      description: >
        Recibe el campo `content` (texto plano, HTML o XML ya procesado) y un
        schema_id de tipo txt-json, y devuelve un único objeto JSON con los
        datos extraídos. No se sube ningún archivo. Máximo 300.000 caracteres.
        URL pública: POST https://claix.dev/api/txt-json. Tarifa fija
        €0,10 por llamada exitosa (HTTP 200) tras las 15 primeras gratis.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TxtJsonRequest'
      responses:
        '200':
          description: Contenido analizado y datos extraídos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocJsonSuccessResponse'
        '400':
          description: Petición inválida (content faltante o vacío, schema_id incorrecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El schema_id no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: El contenido supera 300.000 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: No se pudo extraer datos del contenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /get-document/{document_id}:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    get:
      operationId: getDocument
      tags:
        - Ventana de Contexto
      summary: Devuelve el contenido bruto de un documento procesado
      description: >
        Equivale a GET https://claix.dev/get-document/{document_id}.
        Endpoint de solo lectura, sin body ni query params. Recupera el
        contenido bruto (texto/markdown) y metadatos de un documento ya
        procesado por un endpoint de extracción con window_context activo.
        El documento debe pertenecer a la cuenta de la API key y no haber
        expirado. Esta llamada es gratuita: no se factura ni consume el cupo
        de extracciones.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context/get-document
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del documento persistido en documents.
      responses:
        '200':
          description: Contenido bruto y metadatos del documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentSuccessResponse'
        '400':
          description: Petición inválida (document_id ausente o mal formado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El documento no existe, no pertenece a la cuenta o ha expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite GET)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /document-context/{document_id}:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    post:
      operationId: documentContextAsk
      tags:
        - Ventana de Contexto
      summary: Responde preguntas sobre un documento persistido
      description: >
        Equivale a POST https://claix.dev/document-context/{document_id}.
        Recibe un document_id en la URL (el que devolvió una extracción con
        window_context activo) y un array `questions` en JSON. Carga
        markdown_content de la tabla documents, llama a Gemini 3.6 con el mismo
        modelo y generationConfig que el resto de funciones, y devuelve
        `{ user_ask, ia_response }`. Máximo 5 preguntas y 400 caracteres por
        pregunta. El documento debe pertenecer a la cuenta de la API key y no
        haber expirado.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del documento persistido en documents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowContextRequest'
      responses:
        '200':
          description: Preguntas respondidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowContextSuccessResponse'
        '400':
          description: Petición inválida (JSON, questions o document_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El documento no existe, no pertenece a la cuenta o ha expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /space-context/{space_id}:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    post:
      operationId: spaceContextAsk
      tags:
        - Espacios de Conocimiento
      summary: Responde preguntas cruzando todos los documentos de un espacio
      description: >
        Equivale a POST https://claix.dev/space-context/{space_id}.
        Mismo formato de entrada y de salida que
        POST /document-context/{document_id}: body con un array `questions`
        (máximo 5 preguntas, 400 caracteres cada una) y respuesta
        `{ user_ask, ia_response }` alineada 1:1. La única diferencia es el
        alcance: en vez de un único documento, carga el markdown_content de
        todos los documentos vigentes cuyo `espacio_id` sea ese space_id, y
        responde cruzando la información entre ellos (comparar, sumar,
        relacionar o consolidar datos repartidos en varios archivos). El
        espacio debe pertenecer a la cuenta de la API key. Los documentos
        expirados se ignoran. Para acotar coste y mantener la precisión del
        modelo se cargan como máximo 50 documentos y 200.000 caracteres en
        total, repartidos entre ellos.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context
      parameters:
        - name: space_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: >
            UUID del espacio de conocimiento en espacios_conocimiento. Es el
            mismo valor que se envía como `space_id` opcional en los endpoints
            de extracción para agrupar el documento en ese espacio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceContextRequest'
      responses:
        '200':
          description: Preguntas respondidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceContextSuccessResponse'
        '400':
          description: >
            Petición inválida (JSON, questions, space_id mal formado) o el
            espacio no tiene documentos vigentes con contenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El espacio de conocimiento no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo del servicio de IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /create-space:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    post:
      operationId: createSpace
      tags:
        - Espacios de Conocimiento
      summary: Crea un espacio de conocimiento en la cuenta del API key
      description: >
        Equivale a POST https://claix.dev/create-space. Crea un espacio de
        conocimiento vacío en la cuenta de la API key. El único campo
        obligatorio es `name`. Devuelve el `space_id` que luego se envía como
        `space_id` opcional en los endpoints de extracción para agrupar
        documentos, y que identifica el espacio en
        POST /space-context/{space_id}. Esta llamada es gratuita: no se factura
        ni consume el cupo de extracciones.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context/create-space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
            example:
              name: Proveedores 2026
      responses:
        '201':
          description: Espacio de conocimiento creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSpaceSuccessResponse'
        '400':
          description: Payload inválido (name ausente, vacío o demasiado largo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado (API key inválida, inactiva o cuenta suspendida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite POST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /delete-space/{space_id}:
    servers:
      - url: https://claix.dev
        description: Producción (dominio público Claix)
    delete:
      operationId: deleteSpace
      tags:
        - Espacios de Conocimiento
      summary: Elimina un espacio de conocimiento
      description: >
        Equivale a DELETE https://claix.dev/delete-space/{space_id}. Borra el
        espacio indicado en la ruta, filtrando a la vez por espacio y por
        cuenta de la API key, de modo que un espacio ajeno nunca se puede
        borrar. No admite body ni query params. Si no se elimina ninguna fila
        (no existe o es ajeno), responde 404 con mensaje genérico. Llamada
        gratuita.
      externalDocs:
        description: Documentación humana
        url: https://claix.dev/documentation/window-context/delete-space
      parameters:
        - name: space_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: >
            UUID del espacio de conocimiento a eliminar, el que devolvió
            POST /create-space.
      responses:
        '200':
          description: Espacio de conocimiento eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSpaceSuccessResponse'
        '400':
          description: space_id ausente en la URL o con formato UUID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El espacio no existe o no pertenece a la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método HTTP no permitido (solo se admite DELETE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

