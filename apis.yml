aid: claix-dev
name: Claix
description: >-
  Claix is a Madrid-based B2B document intelligence API that converts PDFs, Excel/CSV, Word and
  text documents and images into strictly typed JSON against customer-defined schemas, keeps
  extracted documents as queryable context for AI agents (single-document and knowledge-space
  Q&A with deterministic nulls), and exposes one 20-operation contract three ways: REST (OpenAPI
  3.0.3), a hosted MCP server at /mcp, and a native A2A agent at /a2a with a published, conformant
  agent card. Pay-as-you-go in euros after 100 free calls, with a free BYOK mode; official Python
  SDK and n8n node.
image: https://www.claix.dev/claix-logo.png
url: https://raw.githubusercontent.com/api-evangelist/claix-dev/refs/heads/main/apis.yml
