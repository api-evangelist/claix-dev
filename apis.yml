- aid: claix-dev:claix-mcp-server
  name: Claix MCP Server
  image: https://www.claix.dev/claix-logo.png
  description: >-
    Hosted, remote Model Context Protocol server (Streamable HTTP and legacy SSE) exposing the
    REST contract as dot-named tools - claix.schemas.*, claix.extract.*, claix.agent.*,
    claix.convert.json_to_excel, claix.window_context.*, claix.document.delete - plus workflow
    prompts and doc resources. tools/list answers anonymously; calls need the x-api-key header.
    Listed on Smithery as info-f4xz/claix.
  humanURL: https://www.claix.dev/documentation/mcp
  baseURL: https://www.claix.dev/mcp
