- aid: claix-dev:claix-a2a-agent
  name: Claix A2A Agent
  image: https://www.claix.dev/claix-logo.png
  description: >-
    Native Agent-to-Agent (A2A 0.3) JSON-RPC agent at /a2a with a public agent card at
    /.well-known/agent-card.json declaring 20 skills, each bound by the provider to its OpenAPI
    operation. message/send with a DataPart or TextPart, tasks/get, tasks/cancel and push
    notifications for long tasks; same API key as REST; 60 requests/minute per key.
  humanURL: https://www.claix.dev/documentation/a2a
  baseURL: https://www.claix.dev/a2a
