apis:
- aid: claix-dev:claix-mcp-server
  name: Claix MCP Server
  image: https://www.claix.dev/claix-logo.png
  description: >-
    Hosted, remote Model Context Protocol server (Streamable HTTP and legacy SSE) exposing the REST contract
    as dot-named tools - claix.schemas.*, claix.extract.*, claix.agent.*, claix.convert.json_to_excel,
    claix.window_context.*, claix.document.delete - plus workflow prompts and doc resources. tools/list
    answers anonymously; calls need the x-api-key header. Listed on Smithery as info-f4xz/claix.
  humanURL: https://www.claix.dev/documentation/mcp
  baseURL: https://www.claix.dev/mcp
  tags:
  - MCP
  - AI Agents
  - Document Processing
  properties:
  - type: MCPServer
    url: mcp/claix-dev-mcp.yml
  - type: ToolCrosswalk
    url: mcp/claix-dev-tool-crosswalk.yml
  - type: Documentation
    url: https://www.claix.dev/documentation/mcp
- aid: claix-dev:claix-a2a-agent
  name: Claix A2A Agent
  image: https://www.claix.dev/claix-logo.png
  description: >-
    Native Agent-to-Agent (A2A 0.3) JSON-RPC agent at /a2a with a public agent card at /.well-known/agent-card.json
    declaring 20 skills, each bound by the provider to its OpenAPI operation. message/send with a DataPart
    or TextPart, tasks/get, tasks/cancel and push notifications for long tasks; same API key as REST;
    60 requests/minute per key.
  humanURL: https://www.claix.dev/documentation/a2a
  baseURL: https://www.claix.dev/a2a
  tags:
  - A2A
  - AI Agents
  - Document Processing
  properties:
  - type: AgentCard
    url: a2a/claix-dev-a2a.yml
  - type: Documentation
    url: https://www.claix.dev/documentation/a2a
  - type: Webhooks
    url: asyncapi/claix-dev-webhooks.yml
