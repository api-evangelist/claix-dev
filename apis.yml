apis:
- aid: claix-dev:claix-document-intelligence-api
  name: Claix Document Intelligence API
  image: https://www.claix.dev/claix-logo.png
  description: >-
    REST API (Claix API 1.8.2) with 20 operations: six schema-driven conversions (Excel/CSV, PDF,
    Word/text, image and raw text to JSON; JSON to Excel), five Agent-mode variants that add a
    reasoning layer, schema management, and the context layer - persisted documents you can read,
    ask and delete, and knowledge spaces you can query across. API key in x-api-key or Bearer;
    multipart uploads in, typed JSON out.
  humanURL: https://www.claix.dev/documentation/excel-to-json
