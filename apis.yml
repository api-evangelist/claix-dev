  name: Claix Espacios de Conocimiento API
  description: >-
    Creación y borrado de espacios de conocimiento, y preguntas cruzadas sobre todos los documentos vigentes
    agrupados en uno de ellos. El formato de entrada y salida de las preguntas es el mismo que en la ventana
    de contexto. URLs públicas: POST https://claix.dev/create-space; DELETE https://claix.dev/delete-space/{space_id};
    POST https://claix.dev/space-context/{space_id}.
